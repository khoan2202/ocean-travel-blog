name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      ADMIN_KEY: ci-test-key
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: |
          node dev-server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/stats >/dev/null && break; sleep 1; done
      - run: npm run test:api
